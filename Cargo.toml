[package]
name = "quirt"
version = "1.0.3"
edition = "2024"
rust-version = "1.85"
description = "Display QR codes in a terminal emulator"
license = "MIT"
repository = "https://github.com/eindiran/quirt"
readme = "README.md"
keywords = ["qr", "qrcode", "terminal", "cli"]
categories = ["command-line-interface", "encoding"]

[dependencies]
# Default features add unused image/SVG renderers.
qrcode = { version = "0.14.1", default-features = false }
thiserror = "2.0.21"
# CLI only (feature `cli`).
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
clap_mangen = { version = "0.3.3", optional = true }
terminal_size = { version = "0.4.4", optional = true }

# PTY tests; already in the tree via terminal_size.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", features = ["pty", "termios"] }

[features]
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:clap_complete",
    "dep:clap_mangen",
    "dep:terminal_size",
]

[[bin]]
name = "quirt"
path = "src/main.rs"
required-features = ["cli"]

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
